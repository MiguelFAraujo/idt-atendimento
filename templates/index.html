<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SebastianCom Atendimento</title>
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111b21">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">

<style>
  :root{
    --bg:#0b141a; --panel:#111b21; --panel2:#202c33; --line:#2a3942;
    --txt:#e9edef; --dim:#8696a0; --out:#005c4b; --in:#202c33;
    --accent:#00a884; --danger:#f15c6d; --warn:#f0b27a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
       display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  header{background:var(--panel);padding:8px 14px;display:flex;align-items:center;gap:12px;
         border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600;display:flex;align-items:center;gap:8px}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  header .sub{color:var(--dim);font-size:12px;margin-left:auto}
  #tabs{display:flex;gap:4px}
  .tab{background:transparent;color:var(--dim);border:1px solid transparent;border-radius:8px;
       padding:6px 10px;font-weight:600;cursor:pointer;font-size:13px}
  .tab.active{background:var(--panel2);color:var(--txt);border-color:var(--line)}
  main{flex:1 1 auto;display:flex;min-height:0}
  #list{width:340px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #search{padding:8px;border-bottom:1px solid var(--line)}
  #search input{width:100%;background:var(--panel2);border:none;color:var(--txt);
                padding:9px 12px;border-radius:8px;outline:none}
  #convs{overflow-y:auto;flex:1 1 auto}
  .conv{padding:10px 14px;display:flex;gap:10px;cursor:pointer;border-bottom:1px solid #1c262c}
  .conv:hover{background:#151f26}
  .conv.active{background:#1f2c33}
  .ava{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;
       justify-content:center;font-weight:700;color:#fff;background:#3a4a52}
  .cmeta{min-width:0;flex:1}
  .crow{display:flex;justify-content:space-between;gap:8px}
  .cname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctime{color:var(--dim);font-size:12px;flex:0 0 auto}
  .cprev{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{background:var(--accent);color:#04140f;font-size:11px;font-weight:700;border-radius:10px;
         padding:1px 7px;margin-left:6px;vertical-align:middle}
  .conv.unread .cname{color:#fff}
  .conv.unread .cprev{color:#c8d1d6}
  .tag{font-size:10px;padding:2px 7px;border-radius:8px;margin-left:6px;vertical-align:middle;font-weight:600}
  .tag.bot{background:#1f3a33;color:#7ee0c4}
  .tag.hum{background:#3a2a1f;color:#f0b27a}
  .tag.sess{background:#26313a;color:#9fd0ff;border:1px solid #2f4a5e}
  #sess{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;
        padding:6px 8px;font-size:13px;font-weight:600;outline:none;max-width:190px}
  #thead .sessname{font-size:11px;color:var(--dim);margin-left:6px}
  #thread{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;background:#0b141a}
  #thead{background:var(--panel2);padding:8px 14px;display:flex;align-items:center;gap:10px;
         border-bottom:1px solid var(--line);flex:0 0 auto}
  #thead .name{font-weight:600}
  #thead .sp{flex:1}
  button{border:none;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:13px}
  .b-assum{background:var(--accent);color:#04140f}
  .b-bot{background:#3a4a52;color:#e9edef}
  #msgs{flex:1 1 auto;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
  .msg{max-width:78%;padding:7px 11px;border-radius:9px;font-size:14px;word-wrap:break-word;white-space:pre-wrap}
  .msg.in{align-self:flex-start;background:var(--in);border-top-left-radius:2px}
  .msg.out{align-self:flex-end;background:var(--out);border-top-right-radius:2px}
  .msg .t{display:block;font-size:10px;color:#ffffff8c;margin-top:3px;text-align:right}
  #composer{flex:0 0 auto;padding:8px;display:flex;gap:8px;background:var(--panel);border-top:1px solid var(--line)}
  #composer textarea{flex:1;resize:none;background:var(--panel2);border:none;color:var(--txt);
                     border-radius:8px;padding:10px 12px;outline:none;font:inherit;max-height:120px}
  #composer button{background:var(--accent);color:#04140f;padding:0 18px}
  .empty{color:var(--dim);text-align:center;margin:auto;padding:30px}
  .back{display:none}
  /* paineis */
  .panel{flex:1 1 auto;overflow-y:auto;padding:18px;min-height:0}
  .panel[hidden]{display:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 auto 14px;max-width:860px}
  .card h2{margin:0 0 10px;font-size:15px}
  .card h3{margin:14px 0 6px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid #1c262c}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--dim)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px}
  .chip.on{background:#1f3a33;color:#7ee0c4;border-color:#1f3a33}
  .svc{padding:8px 0;border-bottom:1px solid #1c262c}
  .svc:last-child{border-bottom:none}
  .svc b{color:#fff}
  .svc small{color:var(--dim)}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .b-sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .b-on{background:var(--accent);color:#04140f}
  .b-off{background:#3a4a52;color:var(--txt)}
  .b-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  .bad{color:var(--danger)}
  .warn{color:var(--warn)}
  details{border-bottom:1px solid #1c262c;padding:6px 0}
  details summary{cursor:pointer;color:#cfe8e0}
  details p{color:var(--dim);margin:6px 0 2px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #1c262c}
  th{color:var(--dim);font-weight:600}
  
  /* PWA banner e Login Modal */
  #btn-install{background:#1f3a33;color:#7ee0c4;border:1px solid #00a884;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;display:none;cursor:pointer}
  #btn-logout{background:transparent;color:var(--dim);border:none;padding:5px 8px;font-size:12px;cursor:pointer}
  #btn-logout:hover{color:var(--danger)}
  #login-modal{display:none;position:fixed;inset:0;background:rgba(11,20,26,0.96);z-index:99999;align-items:center;justify-content:center;padding:20px}
  .login-card{background:#111b21;border:1px solid var(--line);border-radius:14px;padding:32px 26px;max-width:380px;width:100%;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,0.6)}
  .login-icon{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#04140f;font-size:26px;font-weight:bold;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}

  @media(max-width:760px){
    #list{width:100%}
    #thread{display:none}
    body.open #list{display:none}
    body.open #thread{display:flex}
    .back{display:inline-block;background:#3a4a52;color:#e9edef}
    header .sub{display:none}
  }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span>SebastianCom</h1>
  <nav id="tabs">
    <button class="tab active" data-tab="conversas">Conversas</button>
    <button class="tab" data-tab="chatbot">Chatbot</button>
    <button class="tab" data-tab="servicos">ServiÃ§os</button>
    <button class="tab" data-tab="agenda">Agenda</button>
  </nav>
  <select id="sess" title="NÃºmero / instÃ¢ncia" hidden></select>
  <button id="btn-install">ðŸ“± Instalar App</button>
  <span class="sub" id="status">carregandoâ€¦</span>
  <button id="btn-logout" title="Sair">Sair</button>
</header>

<main id="view-conversas">
  <section id="list">
    <div id="search"><input id="q" placeholder="Buscar conversaâ€¦" autocomplete="off"></div>
    <div id="convs"></div>
  </section>
  <section id="thread">
    <div id="thead">
      <button class="back" id="back">â€¹</button>
      <span class="name" id="tname">Selecione uma conversa</span>
      <span class="sessname" id="tsess"></span>
      <span class="sp"></span>
      <span id="tactions"></span>
    </div>
    <div id="msgs"><div class="empty">Escolha uma conversa ao lado.</div></div>
    <div id="composer" style="display:none">
      <textarea id="txt" rows="1" placeholder="Escreva uma respostaâ€¦"></textarea>
      <button id="send">Enviar</button>
    </div>
  </section>
</main>

<section id="view-chatbot" class="panel" hidden></section>
<section id="view-servicos" class="panel" hidden></section>
<section id="view-agenda" class="panel" hidden></section>

<!-- Modal de Login -->
<div id="login-modal">
  <div class="login-card">
    <div class="login-icon">ðŸ’¬</div>
    <h2 style="margin:0 0 6px;font-size:18px;color:#e9edef">SebastianCom Atendimento</h2>
    <p style="margin:0 0 20px;font-size:13px;color:#8696a0">Digite a senha para acessar as conversas do WhatsApp</p>
    <form id="login-form" onsubmit="event.preventDefault();doLogin()">
      <input type="password" id="login-pwd" placeholder="Senha de acesso" style="width:100%;padding:12px 14px;border-radius:8px;background:#202c33;border:1px solid #2a3942;color:#fff;font-size:16px;outline:none;box-sizing:border-box;margin-bottom:12px;text-align:center" required autofocus>
      <div id="login-err" style="color:#f15c6d;font-size:13px;margin-bottom:12px;display:none"></div>
      <button type="submit" style="width:100%;padding:12px;background:#00a884;color:#04140f;font-weight:700;font-size:15px;border-radius:8px;border:none;cursor:pointer">Entrar no Aplicativo</button>
    </form>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
let CUR=null, CONVS=[], TAB='conversas', SESS='', SESSIONS=[], LABELS={};
const fmt=t=>{if(!t)return'';const d=new Date(t*1000);return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
const multi=()=>SESSIONS.length>1;

/* PWA Install */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = $('#btn-install');
  if(btn) btn.style.display = 'inline-block';
});
const btnInst = $('#btn-install');
if(btnInst){
  btnInst.onclick = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') {
        btnInst.style.display = 'none';
      }
      deferredPrompt = null;
    }
  };
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

function showLogin(err){
  const m = $('#login-modal');
  if(m) {
    m.style.display = 'flex';
    const inp = $('#login-pwd');
    if(inp) inp.focus();
    const e = $('#login-err');
    if(e) {
      if(err) { e.textContent = err; e.style.display = 'block'; }
      else { e.style.display = 'none'; }
    }
  }
}

async function doLogin(){
  const pwd = ($('#login-pwd').value || '').trim();
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pwd})
    });
    if(res.ok){
      $('#login-modal').style.display = 'none';
      boot();
    } else {
      showLogin('Senha incorreta. Tente novamente.');
    }
  } catch(e) {
    showLogin('Erro ao conectar ao servidor.');
  }
}

$('#btn-logout').onclick = () => {
  document.cookie = "idt_atend=; max-age=0; path=/";
  location.href = '/';
};

/* querystring da aba selecionada (filtro por numero) */
function qs(extra){
  const p=new URLSearchParams();
  if(SESS)p.set('s',SESS);
  if(extra)for(const k in extra){if(extra[k]!==undefined&&extra[k]!==null&&extra[k]!=='')p.set(k,extra[k]);}
  const s=p.toString();return s?'?'+s:'';
}
/* querystring de uma conversa (usa a sessao da propria conversa) */
function cqs(extra){
  const p=new URLSearchParams();
  if(CUR&&CUR.session)p.set('s',CUR.session);
  if(extra)for(const k in extra){if(extra[k]!==undefined&&extra[k]!==null&&extra[k]!=='')p.set(k,extra[k]);}
  const s=p.toString();return s?'?'+s:'';
}
const sessLabel=s=>LABELS[s]||s;

/* ---------------- abas ---------------- */
function showTab(t){
  TAB=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  $('#view-conversas').hidden = t!=='conversas';
  $('#view-chatbot').hidden  = t!=='chatbot';
  $('#view-servicos').hidden = t!=='servicos';
  $('#view-agenda').hidden   = t!=='agenda';
  document.body.classList.remove('open');
  if(t==='chatbot') loadChatbot();
  if(t==='servicos') loadServicos();
  if(t==='agenda') loadAgenda();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

/* ---------------- seletor de numero ---------------- */
function buildSessSelect(){
  const sel=$('#sess');
  if(!multi()){sel.hidden=true;return;}
  sel.hidden=false;
  sel.innerHTML='<option value="">Todos os nÃºmeros</option>'+
    SESSIONS.map(s=>`<option value="${esc(s)}">${esc(sessLabel(s))}</option>`).join('');
  sel.value=SESS;
  sel.onchange=()=>{
    SESS=sel.value; CUR=null;
    $('#tname').textContent='Selecione uma conversa'; $('#tsess').textContent='';
    $('#tactions').innerHTML=''; $('#composer').style.display='none';
    $('#msgs').innerHTML='<div class="empty">Escolha uma conversa ao lado.</div>';
    loadConvs();
  };
}

/* ---------------- conversas ---------------- */
async function loadConvs(){
  const q=$('#q').value.trim();
  const params=new URLSearchParams();
  if(q)params.set('q',q);
  if(SESS)params.set('s',SESS);
  const r=await fetch('/api/conversations'+(params.toString()?'?'+params.toString():''));
  if(r.status===401){
    showLogin();
    return;
  }
  const data = await r.json();
  CONVS = Array.isArray(data) ? data : [];
  const box=$('#convs'); box.innerHTML='';
  if(!CONVS.length){box.innerHTML='<div class="empty">Nenhuma conversa ainda.</div>';return;}
  for(const c of CONVS){
    const el=document.createElement('div');
    const active=CUR&&CUR.id===c.id&&CUR.session===c.session;
    el.className='conv'+(active?' active':'')+(c.unread>0?' unread':'');
    el.onclick=()=>openConv(c);
    const ini=(c.name||'?').trim().charAt(0).toUpperCase();
    const badge=c.unread>0?`<span class="badge">${c.unread}</span>`:'';
    const st=multi()?`<span class="tag sess">${esc(c.label||sessLabel(c.session))}</span>`:'';
    el.innerHTML=`<div class="ava">${esc(ini)}</div><div class="cmeta">
      <div class="crow"><span class="cname">${esc(c.name)}${c.is_group?' ðŸ‘¥':''}${st}
        <span class="tag ${c.mode==='humano'?'hum':'bot'}">${c.mode==='humano'?'humano':'bot'}</span></span>
        <span class="ctime">${badge}${fmt(c.last_message_at)}</span></div>
      <div class="cprev">${esc(c.preview||'')}</div></div>`;
    box.appendChild(el);
  }
  const tot=CONVS.reduce((s,c)=>s+(c.unread||0),0);
  const filt=SESS?(' Â· '+sessLabel(SESS)):'';
  $('#status').textContent=CONVS.length+' conversas'+(tot?' Â· '+tot+' nÃ£o lidas':'')+filt;
}

async function openConv(c){
  CUR=c; document.body.classList.add('open');
  $('#tname').textContent=c.name;
  $('#tsess').textContent=multi()?('Â· '+sessLabel(c.session)):'';
  $('#composer').style.display='flex';
  renderActions(c);
  await loadMsgs();
  loadConvs();
}

function renderActions(c){
  const a=$('#tactions'); a.innerHTML='';
  if(c.mode==='humano'){
    const b=document.createElement('button'); b.className='b-bot'; b.textContent='ðŸ¤– Devolver ao RobÃ´';
    b.onclick=()=>setMode('bot'); a.appendChild(b);
  }else{
    const b=document.createElement('button'); b.className='b-assum'; b.textContent='ðŸ‘¤ Assumir Atendimento';
    b.onclick=()=>setMode('humano'); a.appendChild(b);
  }
}

async function setMode(mode){
  await fetch('/api/conversations/'+encodeURIComponent(CUR.id)+'/mode'+cqs(),
    {method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({mode,session:CUR.session})});
  CUR.mode=mode; renderActions(CUR); loadConvs();
}

async function loadMsgs(){
  const r=await fetch('/api/conversations/'+encodeURIComponent(CUR.id)+cqs());
  if(r.status===401){ showLogin(); return; }
  const d=await r.json();
  const box=$('#msgs'); box.innerHTML='';
  if(!d.messages||!d.messages.length){box.innerHTML='<div class="empty">Sem mensagens armazenadas.</div>';}
  else for(const m of d.messages){
    const el=document.createElement('div');
    el.className='msg '+(m.from_me?'out':'in');
    el.innerHTML=esc(m.body||'')+`<span class="t">${fmt(m.timestamp)}</span>`;
    box.appendChild(el);
  }
  box.scrollTop=box.scrollHeight;
  fetch('/api/conversations/'+encodeURIComponent(CUR.id)+'/read'+cqs(),{method:'POST'});
}

$('#send').onclick=async()=>{
  const t=$('#txt').value.trim(); if(!t||!CUR)return;
  $('#txt').value='';
  const r=await fetch('/api/conversations/'+encodeURIComponent(CUR.id)+'/send'+cqs(),
    {method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({text:t,session:CUR.session})});
  const d=await r.json();
  if(!d.ok)alert('Falha ao enviar: '+(d.error||''));
  await loadMsgs();
};
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#send').click();}});
$('#back').onclick=()=>document.body.classList.remove('open');
$('#q').addEventListener('input',()=>{clearTimeout(window._t);window._t=setTimeout(loadConvs,250);});

/* sessao usada pelas abas de configuracao (a selecionada ou a primeira) */
const cfgSess=()=>SESS||SESSIONS[0]||'';

/* ---------------- aba Chatbot ---------------- */
async function loadChatbot(){
  const p=$('#view-chatbot');
  const r=await fetch('/api/bot/settings');
  if(r.status===401){ showLogin(); return; }
  const d=await r.json();
  const st=d.state||{};
  const b=d.business||{};
  const activeSess=cfgSess();
  p.innerHTML=`
  <div class="card">
    <h2>Status do RobÃ´ â€” ${esc(sessLabel(activeSess))}</h2>
    <div class="kv"><span class="k">Modo Geral</span><b>${esc(d.mode||'')}</b></div>
    <div class="kv"><span class="k">Ciclos executados</span><span>${st.cycles||0}</span></div>
    <div class="kv"><span class="k">Respostas enviadas</span><span>${st.replies_sent||0}</span></div>
    <div class="kv"><span class="k">Erros</span><span>${st.errors||0}</span></div>
    <div class="btnrow">
      <button class="b-sec ${d.mode==='live'?'b-on':''}" onclick="botSet({mode:'live'})">Ligado (Ao Vivo)</button>
      <button class="b-sec ${d.mode==='dry'?'b-on':''}" onclick="botSet({mode:'dry'})">SimulaÃ§Ã£o (Dry-run)</button>
      <button class="b-sec ${d.mode==='off'?'b-on':''}" onclick="botSet({mode:'off'})">Desligado</button>
    </div>
    ${st.last_error?`<div class="kv" style="margin-top:10px"><span class="k bad">Ãšltimo erro</span><span class="bad">${esc(st.last_error)}</span></div>`:''}
  </div>
  <div class="card">
    <h2>InformaÃ§Ãµes da Loja (${esc(b.nome||'SebastianCom')})</h2>
    <p style="color:var(--dim)">${esc(b.descricao||'AssistÃªncia TÃ©cnica e InformÃ¡tica')}</p>
    ${b.endereco?`<div class="kv"><span class="k">EndereÃ§o</span><span>${esc(b.endereco)}</span></div>`:''}
    ${b.whatsapp?`<div class="kv"><span class="k">WhatsApp</span><span>${esc(b.whatsapp)}</span></div>`:''}
  </div>`;
}
async function botSet(patch){
  await fetch('/api/bot/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
  loadChatbot();
}

/* ---------------- aba ServiÃ§os ---------------- */
async function loadServicos(){
  const p=$('#view-servicos');
  const r=await fetch('/api/kb'+qs({s:cfgSess()}));
  if(r.status===401){ showLogin(); return; }
  const res=await r.json();
  const kb=res.kb||{};

/* ---------------- aba Agenda ---------------- */
async function loadAgenda(){
  const p=$('#view-agenda');
  const [bk,sl]=await Promise.all([
    fetch('/api/bookings'+qs({s:cfgSess()})).then(r=>r.ok?r.json():[]),
    fetch('/api/slots'+qs({s:cfgSess(),days:7})).then(r=>r.ok?r.json():[])
  ]);
  const rows=(bk||[]).filter(b=>b.status==='confirmado');
  p.innerHTML=`
  <div class="card">
    <h2>Agendamentos Confirmados (${rows.length}) â€” ${esc(sessLabel(cfgSess()))}</h2>
    ${rows.length?`<table><tr><th>HorÃ¡rio</th><th>Cliente</th><th>ServiÃ§o</th><th>AÃ§Ã£o</th></tr>
      ${rows.map(b=>`<tr><td>${esc(b.slot)}</td><td>${esc(b.name||b.phone||'')}</td><td>${esc(b.service||'â€”')}</td>
        <td><button class="b-danger" onclick="cancelBooking(${b.id})">Cancelar</button></td></tr>`).join('')}
      </table>`:'<p style="color:var(--dim)">Nenhum agendamento pendente.</p>'}
  </div>
  <div class="card">
    <h2>PrÃ³ximos HorÃ¡rios DisponÃ­veis</h2>
    <div class="chips">${(sl||[]).slice(0,24).map(s=>`<span class="chip on">${esc(s.label)}</span>`).join('')||'<span style="color:var(--dim)">â€”</span>'}</div>
  </div>`;
}
async function cancelBooking(id){
  await fetch('/api/bookings/'+id+'/cancel',{method:'POST'});
  loadAgenda();
}

/* ---------------- boot ---------------- */
async function boot(){
  try{
    const h=await fetch('/health').then(r=>r.json());
    SESSIONS=h.sessions||[]; LABELS=h.labels||{};
  }catch(e){}
  const u=new URLSearchParams(location.search);
  const wantS=u.get('s'); 
  if(wantS&&SESSIONS.includes(wantS)) {
    SESS=wantS;
  } else if (SESSIONS.includes('cli-002-sebastiancom')) {
    SESS='cli-002-sebastiancom'; // PreferÃªncia padrÃ£o para o lojista
  }
  buildSessSelect();
  await loadConvs();
  const want=u.get('conv');
  if(want){const c=CONVS.find(x=>x.id===want&&(!SESS||x.session===SESS)); if(c) openConv(c);}
}

boot();
setInterval(()=>{ if(TAB==='conversas'){ loadConvs(); if(CUR) loadMsgs(); } }, 5000);
</script>
